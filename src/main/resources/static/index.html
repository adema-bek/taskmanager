<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        input, button { padding: 8px; margin: 4px 4px 4px 0; }
        table { border-collapse: collapse; width: 100%; margin-top: 12px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        #msg { color: #c00; }
    </style>
</head>
<body>
<h1>Task Manager</h1>

<div id="login">
    <input id="username" placeholder="Логин" value="admin">
    <input id="password" type="password" placeholder="Пароль" value="admin123">
    <button onclick="login()">Войти</button>
</div>
<p id="msg"></p>

<div id="app" style="display:none">
    <button onclick="load('projects')">Проекты</button>
    <button onclick="load('tasks')">Задачи</button>
    <button onclick="load('users')">Пользователи (ADMIN)</button>
    <button onclick="logout()">Выйти</button>
    <div id="result"></div>
</div>

<script>
    let token = null;

    async function login() {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        if (!res.ok) {
            document.getElementById('msg').textContent = 'Неверный логин или пароль';
            return;
        }
        token = (await res.json()).token;
        document.getElementById('msg').textContent = '';
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        load('projects');
    }

    async function load(name) {
        const res = await fetch('/api/' + name, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const box = document.getElementById('result');
        if (res.status === 403) { box.innerHTML = '<p id="msg">Нет доступа (нужна роль ADMIN)</p>'; return; }
        if (!res.ok) { box.innerHTML = '<p id="msg">Ошибка ' + res.status + '</p>'; return; }
        const data = await res.json();
        if (data.length === 0) { box.innerHTML = '<p>Пока пусто</p>'; return; }
        const cols = Object.keys(data[0]);
        box.innerHTML = '<table><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr>' +
            data.map(r => '<tr>' + cols.map(c => '<td>' + (r[c] ?? '') + '</td>').join('') + '</tr>').join('') +
            '</table>';
    }

    function logout() {
        token = null;
        document.getElementById('app').style.display = 'none';
        document.getElementById('login').style.display = 'block';
    }
</script>
</body>
</html>
